<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Courses offered in SVEC</title>
    <title>Courses offered in Sri Vasavi Engineering College</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --muted: #6b7280;
        --accent: #0ea5a4;
        --table-border: #e6edf0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, "Helvetica Neue", Arial;
      }
      body {
        background: var(--bg);
        margin: 0;
        padding: 40px;
        color: #0f172a;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), #60a5fa);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 20px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      p.lead {
        margin: 6px 0 24px;
        color: var(--muted);
      }
      .card {
        background: var(--card);
        padding: 22px;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
      }
      thead th {
        text-align: left;
        padding: 12px 14px;
        border-bottom: 1px solid var(--table-border);
        color: var(--muted);
        font-weight: 600;
      }
      tbody td {
        padding: 14px;
        border-bottom: 1px solid var(--table-border);
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      .short {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo">CRS</div>
        <div>
          <h1>Courses offered in SVEC &amp; Short Forms</h1>
          <h1>Courses</h1>
        </div>
      </header>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Full Course Name</th>
              <th>Short Form(s)</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Bachelor of Technology</td>
              <td class="short">B.Tech</td>
            </tr>
            <tr>
              <td>Master of Technology</td>
              <td class="short">M.Tech</td>
            </tr>
            <tr>
              <td>Master of Business Administration</td>
              <td class="short">MBA</td>
            </tr>
            <tr>
              <td>Polytechnic Diploma (Engineering)</td>
              <td class="short">Polytechnic or Diploma</td>
            </tr>
            <tr>
              <td>Bachelor of Pharmacy</td>
              <td class="short">B.Pharm</td>
            </tr>
            <tr>
              <td>Master of Pharmacy</td>
              <td class="short">M.Pharm</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
